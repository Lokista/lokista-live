<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lokista Live</title>
<meta name="description" content="Twitch, YouTube i Kick Lokisty naraz, na jednym ekranie.">
<meta name="theme-color" content="#0e0e12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lokista Live">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0e0e12;
    --panel: #18181f;
    --line: #2a2a35;
    --text: #f2f2f5;
    --muted: #a0a0ad;
    --twitch: #9146ff;
    --youtube: #ff3b3b;
    --kick: #53fc18;
    --bar-h: 56px;
    --cap: 34px;   /* pasek z nazwą nad każdym odtwarzaczem (skrypt czyta tę wartość) */
    --gap: 6px;    /* odstęp między kaflami (skrypt czyta tę wartość) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }

  /* ---------- górny pasek ---------- */
  .bar {
    height: var(--bar-h); flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 10px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .tools { display: flex; gap: 6px; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font: inherit; font-weight: 600; height: 40px; padding: 0 14px; border-radius: 10px;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none;
  }
  .btn:hover { border-color: #444452; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: #fff; color: #111; border-color: #fff; }
  .btn .ico { font-size: 17px; line-height: 1; }

  /* ---------- ściana z odtwarzaczami ----------
     Rozmiary liczy skrypt (fit), tak żeby każdy obraz miał dokładnie 16:9
     i całość mieściła się na ekranie razem z paskami nazw. */
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; padding: 0 10px 10px; }
  .wall { display: grid; gap: var(--gap); }
  .wall.focus.landscape { grid-template-areas: "main s1" "main s2"; }
  .wall.focus.portrait  { grid-template-areas: "main main" "s1 s2"; }
  .wall.equal.landscape { grid-template-areas: "e1 e1 e2 e2" ". e3 e3 ."; }
  .wall.equal.portrait  { grid-template-areas: "e1" "e2" "e3"; }
  .stage.portrait { align-items: flex-start; padding-top: 4px; }

  .tile { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tile[data-id="twitch"]  { --c: var(--twitch); }
  .tile[data-id="youtube"] { --c: var(--youtube); }
  .tile[data-id="kick"]    { --c: var(--kick); }

  /* Pasek nazwy leży NAD obrazem, nigdy na nim: Twitch nie startuje,
     gdy cokolwiek zasłania jego odtwarzacz. */
  .cap {
    height: var(--cap); flex: none;
    display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px;
    background: var(--panel); border-radius: 10px 10px 0 0;
    border-bottom: 2px solid transparent;
  }
  .tile.has-sound .cap { border-bottom-color: var(--c); }
  .name {
    display: inline-flex; align-items: center; gap: 7px; min-width: 0;
    color: var(--text); font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap;
  }
  .name .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .name .ext { color: var(--muted); font-weight: 400; }
  .cap .spacer { flex: 1; }
  .mini {
    appearance: none; border: 0; background: transparent; color: var(--text);
    font: 600 13px/1 system-ui, sans-serif; height: 28px; padding: 0 8px; border-radius: 8px;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
  }
  .mini:hover { background: #262630; }
  .tile.has-sound .mini.sound { background: var(--c); color: #000; }
  .tile[data-id="twitch"].has-sound .mini.sound { color: #fff; }
  .mini.grow { display: none; }
  .wall.focus .tile:not(.main) .mini.grow { display: inline-flex; }
  .wall.focus .tile:not(.main) .mini.sound { display: none; }
  .wall.focus .tile:not(.main) .cap { cursor: pointer; }

  .screen { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 0 0 10px 10px; overflow: hidden; }
  .screen iframe, .screen > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Twitch nadaje, a jego odtwarzacz stoi – przycisk naprawy na pasku (nigdy na obrazie) */
  .mini.fix { background: #fff; color: #111; }
  .mini.fix:hover { background: #ddd; }
  .mini[hidden] { display: none !important; }
  .tile:has(.mini.fix:not([hidden])) .mini.grow { display: none !important; }
  .cap { overflow: hidden; }

  .error {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 12px; color: var(--muted); font-size: 13px;
  }

  @media (max-width: 520px) {
    .brand span { display: none; }
    .btn { padding: 0 11px; }
    .btn .txt { display: none; }
    .btn.primary .txt { display: inline; }
    .name .ext, .mini.grow .txt, .mini.fix .txt { display: none; }
  }
  /* Telefon poziomo: cieńsze paski, więcej miejsca na obraz */
  @media (max-height: 460px) and (orientation: landscape) {
    :root { --bar-h: 40px; --cap: 26px; }
    .btn { height: 32px; }
    .mini { height: 22px; }
    .stage { padding-bottom: 4px; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><img src="icons/icon-192.png" alt=""><span>Lokista Live</span></div>
  <div class="tools">
    <button id="soundBtn" class="btn primary" type="button" title="Jeśli dalej cicho, dotknij głośnika w samym odtwarzaczu"><span class="ico">🔊</span><span class="txt">Włącz dźwięk</span></button>
    <button id="layoutBtn" class="btn" type="button" title="Zmień układ"><span class="ico">▦</span><span class="txt">Wszystkie równo</span></button>
    <button id="reloadBtn" class="btn" type="button" title="Załaduj od nowa"><span class="ico">⟳</span><span class="txt">Odśwież</span></button>
  </div>
</header>

<div class="stage" id="stage">
  <main id="wall" class="wall focus landscape">
    <section class="tile" data-id="twitch">
      <div class="cap">
        <a class="name" href="https://www.twitch.tv/lokista_" target="_blank" rel="noopener" title="Otwórz na Twitchu"><span class="dot"></span>Twitch <span class="ext">↗</span></a>
        <span class="spacer"></span>
        <button class="mini fix" id="twitchFix" type="button" hidden>▶ Odtwórz</button>
        <button class="mini sound" type="button" data-sound="twitch" title="Dźwięk z Twitcha">🔊</button>
        <button class="mini grow" type="button" data-pick="twitch" title="Pokaż Twitch na dużym ekranie">⤢ <span class="txt">Powiększ</span></button>
      </div>
      <div class="screen" id="screen-twitch"></div>
    </section>
    <section class="tile" data-id="youtube">
      <div class="cap">
        <a class="name" href="https://www.youtube.com/@lokistaofficial/live" target="_blank" rel="noopener" title="Otwórz na YouTube"><span class="dot"></span>YouTube <span class="ext">↗</span></a>
        <span class="spacer"></span>
        <button class="mini sound" type="button" data-sound="youtube" title="Dźwięk z YouTube">🔊</button>
        <button class="mini grow" type="button" data-pick="youtube" title="Pokaż YouTube na dużym ekranie">⤢ <span class="txt">Powiększ</span></button>
      </div>
      <div class="screen" id="screen-youtube"></div>
    </section>
    <section class="tile" data-id="kick">
      <div class="cap">
        <a class="name" href="https://kick.com/lokista" target="_blank" rel="noopener" title="Otwórz na Kicku"><span class="dot"></span>Kick <span class="ext">↗</span></a>
        <span class="spacer"></span>
        <button class="mini sound" type="button" data-sound="kick" title="Dźwięk z Kicka">🔊</button>
        <button class="mini grow" type="button" data-pick="kick" title="Pokaż Kick na dużym ekranie">⤢ <span class="txt">Powiększ</span></button>
      </div>
      <div class="screen" id="screen-kick"></div>
    </section>
  </main>
</div>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
(() => {
  const CHANNELS = {
    twitch: 'lokista_',
    youtube: 'UCbrU7FR9JRchhhF3ka2uYfg', // @lokistaofficial
    kick: 'lokista',
  };
  // Do testów można podmienić kanał w adresie, np. ?kick=xqc&youtube=UC…
  const params = new URLSearchParams(location.search);
  for (const k in CHANNELS) if (params.get(k)) CHANNELS[k] = params.get(k);

  const IDS = ['twitch', 'youtube', 'kick'];
  const NAMES = { twitch: 'Twitch', youtube: 'YouTube', kick: 'Kick' };
  const ALLOW = 'autoplay; fullscreen; encrypted-media; picture-in-picture';

  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const state = {
    layout: store.get('layout', 'focus'),  // 'focus' | 'equal'
    main: store.get('main', 'twitch'),     // duży kafel w układzie focus
    audio: null,                            // który kafel gra z dźwiękiem (null = wszystko wyciszone)
  };
  if (!IDS.includes(state.main)) state.main = 'twitch';
  if (!['focus', 'equal'].includes(state.layout)) state.layout = 'focus';

  const $ = (s, r = document) => r.querySelector(s);
  const wall = $('#wall');
  const stage = $('#stage');
  const tiles = Object.fromEntries(IDS.map(id => [id, $(`.tile[data-id="${id}"]`)]));
  const players = {};

  // ---------- odtwarzacze ----------
  function mountTwitch() {
    const box = $('#screen-twitch');
    box.innerHTML = '<div id="twitch-embed"></div>';
    twitch.online = false;
    if (!window.Twitch || !location.hostname) {
      box.innerHTML = '<div class="error">Twitch nie wczytał się. Sprawdź internet i naciśnij „Odśwież”.</div>';
      players.twitch = { mute() {}, play() {}, paused: () => false };
      return;
    }
    const p = new Twitch.Player('twitch-embed', {
      channel: CHANNELS.twitch,
      parent: [location.hostname],
      width: '100%', height: '100%',
      autoplay: true, muted: state.audio !== 'twitch',
    });
    players.twitch = {
      mute(m) { try { p.setMuted(m); if (!m) p.setVolume(1); } catch {} },
      play() { try { p.play(); } catch {} },
      // Zablokowany odtwarzacz nie zgłasza pauzy – po prostu jego czas stoi w miejscu.
      time() { try { return p.getCurrentTime(); } catch { return 0; } },
      paused() { try { return p.isPaused(); } catch { return false; } },
    };
    const E = Twitch.Player;
    p.addEventListener(E.READY, () => players.twitch.mute(state.audio !== 'twitch'));
    p.addEventListener(E.ONLINE, () => { twitch.online = true; checkTwitch(); });
    p.addEventListener(E.OFFLINE, () => { twitch.online = false; checkTwitch(); });
    [E.PLAY, E.PLAYING, E.PAUSE].forEach(ev => p.addEventListener(ev, () => setTimeout(checkTwitch, 300)));
  }

  function mountYouTube() {
    const box = $('#screen-youtube');
    const f = document.createElement('iframe');
    // "embed/live_stream?channel=" przestało działać. Playlista UULV… to transmisje kanału,
    // najnowsza pierwsza: trwający live gra od razu, a offline – ostatnia transmisja.
    const q = new URLSearchParams({
      list: 'UULV' + CHANNELS.youtube.slice(2), autoplay: '1', mute: '1', playsinline: '1',
      enablejsapi: '1', rel: '0', origin: location.origin,
    });
    f.src = `https://www.youtube.com/embed/videoseries?${q}`;
    f.allow = ALLOW; f.allowFullscreen = true; f.title = 'YouTube';
    box.replaceChildren(f);
    const cmd = (func, args = []) => {
      try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); } catch {}
    };
    players.youtube = {
      mute(m) { if (m) cmd('mute'); else { cmd('unMute'); cmd('setVolume', [100]); } },
    };
    // YouTube przyjmuje komendy dopiero po załadowaniu – ponów stan dźwięku po starcie
    f.addEventListener('load', () => {
      [500, 1500, 3500].forEach(t => setTimeout(() => players.youtube.mute(state.audio !== 'youtube'), t));
    });
  }

  function mountKick() {
    const box = $('#screen-kick');
    const f = document.createElement('iframe');
    f.allow = ALLOW; f.allowFullscreen = true; f.title = 'Kick';
    f.setAttribute('scrolling', 'no');
    box.replaceChildren(f);
    const src = m => `https://player.kick.com/${CHANNELS.kick}?autoplay=true&muted=${m}`;
    let muted = state.audio !== 'kick';
    f.src = src(muted);
    // Kick nie ma API do wyciszania – zmiana dźwięku = przeładowanie odtwarzacza
    players.kick = {
      mute(m) { if (m !== muted) { muted = m; f.src = src(m); } },
    };
  }

  function mountAll() { mountTwitch(); mountYouTube(); mountKick(); }

  // ---------- rozmiary: każdy obraz 16:9, pasek nazwy (CAP) nad nim ----------
  function fit() {
    const cs = getComputedStyle(stage);
    const W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const portrait = innerHeight > innerWidth;
    const root = getComputedStyle(document.documentElement);
    const R = 9 / 16, c = parseFloat(root.getPropertyValue('--cap')), g = parseFloat(root.getPropertyValue('--gap'));
    let cols, rows;

    if (state.layout === 'focus' && !portrait) {
      // duży (m) po lewej, dwa małe (s) jeden pod drugim: m = 2s + (c+g)/R
      const k = (c + g) / R;
      const s = Math.max(60, Math.min((W - k - g) / 3, ((H - c) / R - k) / 2));
      const m = 2 * s + k;
      const h = m * R + c;
      cols = [m, s]; rows = [(h - g) / 2, (h - g) / 2];
    } else if (state.layout === 'focus') {
      // duży (m) u góry, dwa małe (s) obok siebie pod spodem
      const m = Math.max(120, Math.min(W, (H - 2 * c - g + g * R / 2) / (R * 1.5)));
      const s = (m - g) / 2;
      cols = [s, s]; rows = [m * R + c, s * R + c];
    } else if (!portrait) {
      // dwa u góry, jeden na dole na środku, każdy szerokości t
      const t = Math.max(100, Math.min((W - g) / 2, (H - g - 2 * c) / (2 * R)));
      const q = (t - g) / 2;
      cols = [q, q, q, q]; rows = [t * R + c, t * R + c];
    } else {
      // trzy jeden pod drugim
      const t = Math.max(100, Math.min(W, (H - 2 * g - 3 * c) / (3 * R)));
      cols = [t]; rows = [t * R + c, t * R + c, t * R + c];
    }
    const px = a => a.map(v => `${Math.floor(v)}px`).join(' ');
    wall.style.gridTemplateColumns = px(cols);
    wall.style.gridTemplateRows = px(rows);
    wall.classList.toggle('portrait', portrait);
    wall.classList.toggle('landscape', !portrait);
    stage.classList.toggle('portrait', portrait);
    checkTwitch();
  }

  // Twitch sam decyduje, czy wystartuje: nie rusza, gdy coś zasłania odtwarzacz
  // (dlatego nic na nim nie leży) albo gdy okno jest bardzo małe (np. mały kafel na telefonie).
  // Nie zgadujemy po rozmiarze – pytamy odtwarzacz. Gdy kanał nadaje, a Twitch stoi,
  // na pasku NAD obrazem pojawia się przycisk, który to naprawia.
  const twitch = { online: false, lastTime: -1, still: 0 };
  function checkTwitch() {
    const fix = $('#twitchFix');
    const stuck = twitch.online && (twitch.still >= 2 || players.twitch?.paused());
    const small = state.layout !== 'focus' || state.main !== 'twitch';
    fix.hidden = !stuck;
    fix.dataset.action = small ? 'grow' : 'play';
    fix.innerHTML = small ? '▶ <span class="txt">Nie gra – </span>Powiększ' : '▶ Odtwórz';
  }
  setInterval(() => {
    const t = players.twitch?.time?.() ?? 0;
    twitch.still = (twitch.online && t === twitch.lastTime) ? twitch.still + 1 : 0;
    twitch.lastTime = t;
    checkTwitch();
  }, 3000);

  // ---------- układ i dźwięk ----------
  function render() {
    wall.classList.toggle('focus', state.layout === 'focus');
    wall.classList.toggle('equal', state.layout === 'equal');
    const order = state.layout === 'focus'
      ? [state.main, ...IDS.filter(i => i !== state.main)]
      : IDS;
    const areas = state.layout === 'focus' ? ['main', 's1', 's2'] : ['e1', 'e2', 'e3'];
    order.forEach((id, i) => {
      tiles[id].style.gridArea = areas[i];   // zmiana miejsca bez przeładowania odtwarzacza
      tiles[id].classList.toggle('main', state.layout === 'focus' && i === 0);
    });
    IDS.forEach(id => tiles[id].classList.toggle('has-sound', state.audio === id));

    const sb = $('#soundBtn');
    sb.classList.toggle('primary', !state.audio);
    sb.querySelector('.ico').textContent = state.audio ? '🔇' : '🔊';
    sb.querySelector('.txt').textContent = state.audio ? 'Wycisz' : 'Włącz dźwięk';

    $('#layoutBtn .txt').textContent = state.layout === 'focus' ? 'Wszystkie równo' : 'Jeden duży';
    $('#layoutBtn .ico').textContent = state.layout === 'focus' ? '▦' : '◧';
    fit();
  }

  function applyAudio() {
    IDS.forEach(id => players[id]?.mute(state.audio !== id));
    render();
  }

  function setAudio(id) { state.audio = id; applyAudio(); }

  function promote(id) {
    state.main = id;
    store.set('main', id);
    if (state.audio) state.audio = id;   // dźwięk idzie za dużym ekranem
    applyAudio();
    if (id === 'twitch') setTimeout(() => players.twitch?.play(), 400);
  }

  $('#soundBtn').addEventListener('click', () => {
    setAudio(state.audio ? null : (state.layout === 'focus' ? state.main : 'twitch'));
  });

  $('#layoutBtn').addEventListener('click', () => {
    state.layout = state.layout === 'focus' ? 'equal' : 'focus';
    store.set('layout', state.layout);
    render();
  });

  $('#reloadBtn').addEventListener('click', mountAll);

  wall.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const fix = e.target.closest('#twitchFix');
    if (fix) {
      if (fix.dataset.action === 'grow') {
        state.layout = 'focus';
        store.set('layout', 'focus');
        promote('twitch');
      } else {
        players.twitch?.play();
      }
      return;
    }
    const pick = e.target.closest('[data-pick]');
    if (pick) { promote(pick.dataset.pick); return; }
    const snd = e.target.closest('[data-sound]');
    if (snd) { setAudio(state.audio === snd.dataset.sound ? null : snd.dataset.sound); return; }
    // cały pasek małego kafla też powiększa
    const cap = e.target.closest('.cap');
    const tile = cap?.closest('.tile');
    if (tile && state.layout === 'focus' && !tile.classList.contains('main')) promote(tile.dataset.id);
  });

  addEventListener('resize', fit);
  new ResizeObserver(fit).observe(stage);

  // ---------- ekran nie gaśnie podczas oglądania ----------
  let lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !lock) {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } } catch {}
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', keepAwake, { once: true });

  // ---------- start ----------
  render();
  mountAll();
  keepAwake();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
