<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lokista Live</title>
<meta name="description" content="Twitch, YouTube i Kick Lokisty naraz, na jednym ekranie.">
<meta name="theme-color" content="#0e0e12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lokista Live">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0e0e12;
    --panel: #18181f;
    --line: #2a2a35;
    --text: #f2f2f5;
    --muted: #a0a0ad;
    --twitch: #9146ff;
    --youtube: #ff3b3b;
    --kick: #53fc18;
    --bar-h: 56px;
    --gap: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }

  /* ---------- górny pasek ---------- */
  .bar {
    height: var(--bar-h); flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 10px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .tools { display: flex; gap: 6px; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font: inherit; font-weight: 600; height: 40px; padding: 0 14px; border-radius: 10px;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: #444452; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: #fff; color: #111; border-color: #fff; }
  .btn .ico { font-size: 17px; line-height: 1; }

  /* ---------- ściana z odtwarzaczami ---------- */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 10px 10px; min-height: 0; }
  .wall {
    /* --ar = proporcje całego bloku, liczone tak, żeby każdy kafel był 16:9 */
    --ar: 2.6667;
    width: min(100%, calc((100dvh - var(--bar-h) - 10px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * var(--ar)));
    aspect-ratio: var(--ar);
    display: grid; gap: var(--gap);
  }
  /* Szeroki ekran: duży po lewej, dwa małe po prawej */
  .wall.focus {
    --ar: 2.6667; /* 8:3 */
    grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr;
    grid-template-areas: "main s1" "main s2";
  }
  /* Szeroki ekran: wszystkie równo (2 u góry, 1 na dole na środku) */
  .wall.equal {
    --ar: 1.7778; /* 16:9 */
    grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr;
    grid-template-areas: "e1 e1 e2 e2" ". e3 e3 .";
  }
  @media (orientation: portrait) {
    .stage { align-items: flex-start; padding-top: 4px; }
    /* Telefon / tablet pionowo: duży u góry, dwa małe obok siebie pod spodem */
    .wall.focus {
      --ar: 1.1852; /* 32:27 */
      grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr;
      grid-template-areas: "main main" "s1 s2";
    }
    /* Pionowo, wszystkie równo: jeden pod drugim */
    .wall.equal {
      --ar: 0.5926; /* 16:27 */
      grid-template-columns: 1fr; grid-template-rows: repeat(3, 1fr);
      grid-template-areas: "e1" "e2" "e3";
    }
  }

  .tile {
    position: relative; min-width: 0; min-height: 0;
    background: #000; border-radius: 10px; overflow: hidden;
    outline: 2px solid transparent; outline-offset: -2px;
  }
  .tile.has-sound { outline-color: var(--c); }
  .tile[data-id="twitch"]  { --c: var(--twitch); }
  .tile[data-id="youtube"] { --c: var(--youtube); }
  .tile[data-id="kick"]    { --c: var(--kick); }
  .screen, .screen iframe, .screen > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .label {
    position: absolute; left: 8px; top: 8px; z-index: 3;
    display: flex; align-items: center; gap: 6px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    border-radius: 999px; background: rgba(0,0,0,.72); color: #fff; font-size: 13px; font-weight: 700;
    border: 0; font-family: inherit; text-decoration: none; cursor: pointer;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip.sound { padding: 0 9px; font-size: 14px; }
  .tile.has-sound .chip.sound { background: var(--c); color: #000; }
  .tile[data-id="twitch"].has-sound .chip.sound { color: #fff; }

  /* Mały kafel w układzie "duży + 2 małe": dotknięcie powiększa */
  .pick {
    display: none; position: absolute; inset: 0; z-index: 2;
    background: transparent; border: 0; cursor: pointer; padding: 0;
  }
  .pick span {
    position: absolute; right: 8px; bottom: 8px;
    background: rgba(0,0,0,.72); color: #fff; font: 600 12px/1 system-ui, sans-serif;
    padding: 6px 9px; border-radius: 999px;
  }
  .wall.focus .tile:not(.main) .pick { display: block; }
  .wall.focus .tile:not(.main) .label .sound { display: none; }
  .wall.focus .tile:not(.main):hover { outline-color: rgba(255,255,255,.35); }

  .hint {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #fff; color: #111; padding: 10px 16px; border-radius: 12px; font-weight: 600;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 10; max-width: calc(100vw - 32px); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .hint.show { opacity: 1; }

  .error {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 12px; color: var(--muted); font-size: 13px;
  }

  @media (max-width: 520px) {
    .brand span { display: none; }
    .btn { padding: 0 11px; }
    .btn .txt { display: none; }
    .btn.primary .txt { display: inline; }
  }
  @media (max-height: 460px) and (orientation: landscape) {
    :root { --bar-h: 46px; }
    .btn { height: 34px; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><img src="icons/icon-192.png" alt=""><span>Lokista Live</span></div>
  <div class="tools">
    <button id="soundBtn" class="btn primary" type="button"><span class="ico">🔊</span><span class="txt">Włącz dźwięk</span></button>
    <button id="layoutBtn" class="btn" type="button" title="Zmień układ"><span class="ico">▦</span><span class="txt">Wszystkie równo</span></button>
    <button id="reloadBtn" class="btn" type="button" title="Załaduj od nowa"><span class="ico">⟳</span><span class="txt">Odśwież</span></button>
  </div>
</header>

<div class="stage">
  <main id="wall" class="wall focus">
    <section class="tile" data-id="twitch">
      <div class="screen" id="screen-twitch"></div>
      <div class="label">
        <a class="chip" href="https://www.twitch.tv/lokista_" target="_blank" rel="noopener" title="Otwórz na Twitchu"><span class="dot"></span>Twitch ↗</a>
        <button class="chip sound" type="button" data-sound="twitch" title="Dźwięk z Twitcha">🔊</button>
      </div>
      <button class="pick" type="button" data-pick="twitch" aria-label="Pokaż Twitch na dużym ekranie"><span>Powiększ</span></button>
    </section>
    <section class="tile" data-id="youtube">
      <div class="screen" id="screen-youtube"></div>
      <div class="label">
        <a class="chip" href="https://www.youtube.com/@lokistaofficial/live" target="_blank" rel="noopener" title="Otwórz na YouTube"><span class="dot"></span>YouTube ↗</a>
        <button class="chip sound" type="button" data-sound="youtube" title="Dźwięk z YouTube">🔊</button>
      </div>
      <button class="pick" type="button" data-pick="youtube" aria-label="Pokaż YouTube na dużym ekranie"><span>Powiększ</span></button>
    </section>
    <section class="tile" data-id="kick">
      <div class="screen" id="screen-kick"></div>
      <div class="label">
        <a class="chip" href="https://kick.com/lokista" target="_blank" rel="noopener" title="Otwórz na Kicku"><span class="dot"></span>Kick ↗</a>
        <button class="chip sound" type="button" data-sound="kick" title="Dźwięk z Kicka">🔊</button>
      </div>
      <button class="pick" type="button" data-pick="kick" aria-label="Pokaż Kick na dużym ekranie"><span>Powiększ</span></button>
    </section>
  </main>
</div>

<div id="hint" class="hint" role="status"></div>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
(() => {
  const CHANNELS = {
    twitch: 'lokista_',
    youtube: 'UCbrU7FR9JRchhhF3ka2uYfg', // @lokistaofficial
    kick: 'lokista',
  };
  // Do testów można podmienić kanał w adresie, np. ?kick=xqc&youtube=UC…
  const params = new URLSearchParams(location.search);
  for (const k in CHANNELS) if (params.get(k)) CHANNELS[k] = params.get(k);
  const IDS = ['twitch', 'youtube', 'kick'];
  const ALLOW = 'autoplay; fullscreen; encrypted-media; picture-in-picture';

  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const state = {
    layout: store.get('layout', 'focus'),  // 'focus' | 'equal'
    main: store.get('main', 'twitch'),     // duży kafel w układzie focus
    audio: null,                            // który kafel gra z dźwiękiem (null = wszystko wyciszone)
  };
  if (!IDS.includes(state.main)) state.main = 'twitch';
  if (!['focus', 'equal'].includes(state.layout)) state.layout = 'focus';

  const $ = (s, r = document) => r.querySelector(s);
  const wall = $('#wall');
  const tiles = Object.fromEntries(IDS.map(id => [id, $(`.tile[data-id="${id}"]`)]));
  const players = {};

  // ---------- odtwarzacze ----------
  function mountTwitch() {
    const box = $('#screen-twitch');
    box.innerHTML = '<div id="twitch-embed"></div>';
    if (!window.Twitch || !location.hostname) {
      box.innerHTML = '<div class="error">Twitch nie wczytał się. Sprawdź internet i naciśnij „Odśwież”.</div>';
      players.twitch = { mute() {} };
      return;
    }
    const p = new Twitch.Player('twitch-embed', {
      channel: CHANNELS.twitch,
      parent: [location.hostname],
      width: '100%', height: '100%',
      autoplay: true, muted: state.audio !== 'twitch',
    });
    players.twitch = {
      mute(m) { try { p.setMuted(m); if (!m) p.setVolume(1); } catch {} },
    };
    p.addEventListener(Twitch.Player.READY, () => players.twitch.mute(state.audio !== 'twitch'));
  }

  function mountYouTube() {
    const box = $('#screen-youtube');
    const f = document.createElement('iframe');
    // "embed/live_stream?channel=" przestało działać. Playlista UULV… to transmisje kanału,
    // najnowsza pierwsza: trwający live gra od razu, a offline – ostatnia transmisja.
    const q = new URLSearchParams({
      list: 'UULV' + CHANNELS.youtube.slice(2), autoplay: '1', mute: '1', playsinline: '1',
      enablejsapi: '1', rel: '0', origin: location.origin,
    });
    f.src = `https://www.youtube.com/embed/videoseries?${q}`;
    f.allow = ALLOW; f.allowFullscreen = true; f.title = 'YouTube';
    box.replaceChildren(f);
    const cmd = (func, args = []) => {
      try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); } catch {}
    };
    players.youtube = {
      mute(m) { if (m) cmd('mute'); else { cmd('unMute'); cmd('setVolume', [100]); } },
    };
    // YouTube przyjmuje komendy dopiero po załadowaniu – ponów stan dźwięku po starcie
    f.addEventListener('load', () => {
      cmd('addEventListener', ['onReady']);
      [500, 1500, 3500].forEach(t => setTimeout(() => players.youtube.mute(state.audio !== 'youtube'), t));
    });
  }

  function mountKick() {
    const box = $('#screen-kick');
    const f = document.createElement('iframe');
    f.allow = ALLOW; f.allowFullscreen = true; f.title = 'Kick';
    f.setAttribute('scrolling', 'no');
    box.replaceChildren(f);
    const src = m => `https://player.kick.com/${CHANNELS.kick}?autoplay=true&muted=${m}`;
    let muted = state.audio !== 'kick';
    f.src = src(muted);
    // Kick nie ma API do wyciszania – zmiana dźwięku = przeładowanie odtwarzacza
    players.kick = {
      mute(m) { if (m !== muted) { muted = m; f.src = src(m); } },
    };
  }

  function mountAll() { mountTwitch(); mountYouTube(); mountKick(); }

  // ---------- układ i dźwięk ----------
  function render() {
    wall.className = `wall ${state.layout}`;
    const order = state.layout === 'focus'
      ? [state.main, ...IDS.filter(i => i !== state.main)]
      : IDS;
    const areas = state.layout === 'focus' ? ['main', 's1', 's2'] : ['e1', 'e2', 'e3'];
    order.forEach((id, i) => {
      tiles[id].style.gridArea = areas[i];   // zmiana miejsca bez przeładowania odtwarzacza
      tiles[id].classList.toggle('main', state.layout === 'focus' && i === 0);
    });
    IDS.forEach(id => tiles[id].classList.toggle('has-sound', state.audio === id));

    const sb = $('#soundBtn');
    sb.classList.toggle('primary', !state.audio);
    sb.querySelector('.ico').textContent = state.audio ? '🔇' : '🔊';
    sb.querySelector('.txt').textContent = state.audio ? 'Wycisz' : 'Włącz dźwięk';

    $('#layoutBtn .txt').textContent = state.layout === 'focus' ? 'Wszystkie równo' : 'Jeden duży';
    $('#layoutBtn .ico').textContent = state.layout === 'focus' ? '▦' : '◧';
  }

  function applyAudio() {
    IDS.forEach(id => players[id]?.mute(state.audio !== id));
    render();
  }

  let hintTimer;
  function hint(text, ms = 3500) {
    const h = $('#hint');
    h.textContent = text; h.classList.add('show');
    clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.remove('show'), ms);
  }

  const NAMES = { twitch: 'Twitch', youtube: 'YouTube', kick: 'Kick' };
  function setAudio(id) {
    state.audio = id;
    applyAudio();
    if (id) hint(`Dźwięk z: ${NAMES[id]}. Jeśli dalej cicho, dotknij głośnika w samym odtwarzaczu.`);
  }

  $('#soundBtn').addEventListener('click', () => {
    setAudio(state.audio ? null : (state.layout === 'focus' ? state.main : 'twitch'));
  });

  $('#layoutBtn').addEventListener('click', () => {
    state.layout = state.layout === 'focus' ? 'equal' : 'focus';
    store.set('layout', state.layout);
    render();
  });

  $('#reloadBtn').addEventListener('click', () => { mountAll(); hint('Ładuję od nowa…', 1500); });

  wall.addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if (pick) {
      state.main = pick.dataset.pick;
      store.set('main', state.main);
      if (state.audio) state.audio = state.main;   // dźwięk idzie za dużym ekranem
      applyAudio();
      return;
    }
    const snd = e.target.closest('[data-sound]');
    if (snd) setAudio(state.audio === snd.dataset.sound ? null : snd.dataset.sound);
  });

  // ---------- ekran nie gaśnie podczas oglądania ----------
  let lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !lock) {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } } catch {}
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', keepAwake, { once: true });

  // ---------- start ----------
  render();
  mountAll();
  keepAwake();
  setTimeout(() => { if (!state.audio) hint('Wszystko leci bez dźwięku. Naciśnij „Włącz dźwięk”.', 5000); }, 2500);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
